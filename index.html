<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAPG — Colorado School of Mines</title>
<meta name="theme-color" content="#16233d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23014871'/%3E%3Ctext x='32' y='41' font-family='Helvetica,Arial' font-size='19' font-weight='bold' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --navy: #16233d;
    --blue: #014871;
    --green: #2e7d4f;
    --ink: #1b2330;
    --muted: #5d6675;
    --bg: #f6f7f9;
    --card: #ffffff;
    --line: #e3e6ec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e8ecf3; --muted: #9aa4b5; --bg: #10141c;
      --card: #171d28; --line: #2a3140;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 440px; }
  .mark {
    width: 54px; height: 54px; border-radius: 13px; background: var(--blue);
    color: #fff; font-weight: 700; font-size: 20px; letter-spacing: .5px;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;
  }
  h1 { font-size: 21px; margin: 0 0 4px; text-align: center; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 14px; text-align: center; margin: 0 0 26px; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 17px 19px; margin-bottom: 12px;
    transition: border-color .15s ease, transform .15s ease;
  }
  a.card:hover { border-color: var(--blue); transform: translateY(-1px); }
  a.card:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .t { font-weight: 640; font-size: 16px; margin-bottom: 2px; }
  .d { color: var(--muted); font-size: 13.5px; }
  .rule { height: 3px; width: 40px; background: var(--green); border-radius: 2px; margin: 0 auto 22px; }
  footer { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 22px; }
</style>
</head>
<body>
  <main class="wrap">
    <div class="mark">AAPG</div>
    <h1>AAPG — Colorado School of Mines</h1>
    <p class="sub">Student chapter meeting attendance</p>
    <div class="rule"></div>

    <a class="card" href="/checkin/">
      <div class="t">Check in to a meeting</div>
      <div class="d">What the QR code on the sign-in card opens.</div>
    </a>

    <a class="card" href="/dashboard/">
      <div class="t">Officer dashboard</div>
      <div class="d">Attendance, roster and meeting management.</div>
    </a>

    <footer>American Association of Petroleum Geologists</footer>
  </main>
</body>
</html>
